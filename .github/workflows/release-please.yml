name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Package
        if: ${{ steps.release.outputs.release_created }}
        run: npx @vscode/vsce@3.9.2 package --out asymptote.vsix

      - name: Publish to VS Code Marketplace
        if: ${{ steps.release.outputs.release_created }}
        run: bash .github/scripts/publish.sh asymptote.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}