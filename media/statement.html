<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource} 'unsafe-inline'; script-src 'nonce-${nonce}' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src ${cspSource} https: data:;">
    <title>${problemTitle}</title>
    <script nonce="${nonce}">
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="${styleUri}" rel="stylesheet">
    <link href="${statementStyleUri}" rel="stylesheet">
</head>
<body class="statement-page">
    <article class="statement-column">
        <header class="statement-heading">
            <h1>${problemTitle}</h1>
            <p class="statement-limits">${problemLimits}</p>
        </header>
        <div class="prose">${problemBody}</div>
    </article>
</body>
</html>
