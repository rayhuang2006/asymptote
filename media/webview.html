<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource} 'unsafe-inline'; script-src 'nonce-${nonce}'; img-src ${cspSource} https: data:;">
    <title>Asymptote</title>
    <link href="${styleUri}" rel="stylesheet">
</head>
<body>
    <!-- The runner lives in the panel: wide and short. Everything that describes the
         run sits on one row, and the cases below it spread across the width. -->
    <header class="toolbar">
        <div id="problem-slot" class="problem-slot">
            <button id="btn-open-statement" class="problem-link" title="Open the statement beside your code">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5A1.5 1.5 0 0 1 3.5 2H7v12H3.5A1.5 1.5 0 0 1 2 12.5v-9Z"/><path d="M9 2h3.5A1.5 1.5 0 0 1 14 3.5v9a1.5 1.5 0 0 1-1.5 1.5H9V2Z" opacity="0.55"/></svg>
                <span id="problem-title">No problem</span>
            </button>
            <span id="problem-meta" class="problem-meta"></span>
        </div>

        <div id="import-slot" class="import-slot hidden">
            <input type="text" id="problem-url" class="text-input" placeholder="Paste a Codeforces, AtCoder or NCU Online Judge URL" />
            <button id="fetchBtn" class="btn btn-primary">Import</button>
            <button id="btn-manual" class="btn btn-ghost">Start empty</button>
        </div>

        <div id="verdict-strip" class="verdict-strip" aria-label="Test case results"></div>
        <span id="run-summary" class="run-summary"></span>

        <div class="mode-switch" role="tablist">
            <button id="mode-standard" class="mode-option active" role="tab">Cases</button>
            <button id="mode-interactive" class="mode-option" role="tab">Interactive</button>
        </div>

        <button id="runBtn" class="btn btn-primary btn-run">Run</button>
    </header>

    <p id="parse-error" class="inline-error hidden"></p>

    <main id="standard-runner" class="runner-pane">
        <div id="runner-error" class="runner-error hidden">
            <div class="runner-error-header">
                <span id="runner-error-title">Compilation failed</span>
                <button id="btn-copy-error" class="btn-icon" title="Copy">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h6a2 2 0 0 1 2 2v6h-1V4a1 1 0 0 0-1-1H4V2Z"/><path d="M2 5h7a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg>
                </button>
            </div>
            <pre id="runner-error-body"></pre>
        </div>

        <div id="test-cases-container" class="stack-tight"></div>
        <p id="cases-empty" class="empty-state hidden">No test cases yet.</p>
        <button id="btn-add-case" class="btn btn-dashed">+ Add case</button>
    </main>

    <main id="interactive-runner" class="runner-pane interactive hidden">
        <div class="column-header">
            <span class="col">Judge (input)</span>
            <span class="col">Code (output)</span>
        </div>
        <div id="chat-history" class="chat-history">
            <div class="msg-system">Click Start to launch an interactive session.</div>
        </div>
        <div class="runner-actions">
            <button id="interactiveStartBtn" class="btn btn-primary">Start interactive session</button>
            <button id="interactiveStopBtn" class="btn btn-danger hidden">Stop process</button>
        </div>
    </main>

    <script nonce="${nonce}" src="${diffUri}"></script>
    <script nonce="${nonce}" src="${scriptUri}"></script>
</body>
</html>
